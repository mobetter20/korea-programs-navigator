<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korea Programs Navigator</title>
<style>
  @font-face{font-family:'Bagel Fat One';src:url('fonts/bagel-fat-one/bagel-fat-one-400-091.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Source Sans 3';src:url('fonts/source-sans-3/source-sans-3-400-006.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'JetBrains Mono';src:url('fonts/jetbrains-mono/jetbrains-mono-500-000.woff2') format('woff2');font-weight:500;font-display:swap}
  :root{--pink:#ff52e5;--pink-dk:#ca27b2;--gold:#f6d242;--gold-dk:#b58a00;--ink:#1a1a1a;--muted:#8a8398;--bg:#fbf7f0;--line:#ece4d6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Source Sans 3','Apple SD Gothic Neo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}.fat{font-family:'Bagel Fat One','Arial Black',cursive}
  .kr{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif}

  header{position:sticky;top:0;z-index:20;background:rgba(251,247,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:12px;padding:12px 22px}
  .brand{font-size:16px;font-weight:800}.brand .d{color:var(--pink)}
  .live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;font-family:'JetBrains Mono',monospace}
  .led{width:8px;height:8px;border-radius:50%;background:#2da854;animation:p 1.8s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(45,168,84,.5)}70%{box-shadow:0 0 0 7px rgba(45,168,84,0)}100%{box-shadow:0 0 0 0 rgba(45,168,84,0)}}
  .pills{display:flex;gap:7px;padding:0 18px 11px;overflow-x:auto;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
  .pill{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap;transition:.12s}
  .pill:hover{border-color:var(--pink)}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}.pill .n{opacity:.5;margin-left:3px}

  .layout{display:flex;gap:18px;padding:16px 18px 60px;align-items:flex-start}
  .grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
  .card{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:13px;padding:13px 14px;text-decoration:none;color:inherit;transition:.13s;background:var(--tint)}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -16px rgba(40,20,60,.4)}
  .chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cat{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ac);font-family:'JetBrains Mono',monospace}
  .dday{font-family:'Bagel Fat One','Arial Black',cursive;font-size:15px;color:var(--muted)}.dday.hot{color:var(--pink)}
  h3{font-size:14.5px;line-height:1.28;font-weight:700}
  .ko{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:3px}
  .badge{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px}
  .b-fore{background:var(--pink);color:#fff}.b-easy{background:#fff3c2;color:var(--gold-dk)}.b-glob{background:#e8f0ff;color:#2f6bd8}
  .reg{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-left:auto}

  .stream{width:236px;flex:none;position:sticky;top:104px;max-height:calc(100vh - 122px);background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .shead{padding:12px 13px 10px;border-bottom:1px solid var(--line);font-size:12px}.shead b{font-weight:800}.shead .s{display:block;color:var(--muted);font-size:10.5px;margin-top:3px;font-family:'JetBrains Mono',monospace}
  .srows{overflow:auto}
  .tl{display:flex;gap:8px;align-items:baseline;padding:7px 11px;border-bottom:1px solid #f6f0e7;text-decoration:none;color:inherit}.tl:hover{background:var(--bg)}
  .tl-d{font-family:'Bagel Fat One','Arial Black';font-size:12px;color:var(--gold-dk);min-width:30px}.tl-d.hot{color:var(--pink)}
  .tl-t{flex:1;font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{text-align:center;padding:11px;font-size:11px;font-weight:700;color:var(--pink-dk);font-family:'JetBrains Mono',monospace;background:linear-gradient(to bottom,#fff,#ffe9f7)}
  @media(max-width:1000px){.stream{display:none}}
</style>
</head>
<body>
<header>
  <div class="bar"><span class="brand">Korea Programs Navigator<span class="d">.</span></span>
    <span class="live"><span class="led"></span> 296 LIVE · UPDATED JUST NOW</span></div>
  <div class="pills" id="pills"></div>
</header>

<div class="layout">
  <main class="grid" id="grid"></main>
  <aside class="stream">
    <div class="shead"><b>🌐 The full stream</b><span class="s">296 live · always more coming</span></div>
    <div class="srows" id="tl"></div>
    <div class="more">+ 254 more ↓</div>
  </aside>
</div>

<script>
const TODAY=new Date('2026-05-23'); const dd=iso=>Math.max(0,Math.ceil((new Date(iso)-TODAY)/864e5));
const TONE={pink:["#ffe9f7","#ca27b2"],gold:["#fff8d9","#b58a00"],green:["#eafbe4","#3a9d4f"],blue:["#e8f1ff","#2f6bd8"],coral:["#ffeceb","#d8635f"],purple:["#f1ebfd","#7c4dd6"],teal:["#e3f7f4","#1f9e8f"],orange:["#fff1e2","#d9802a"]};
const LENSES=[["all","All"],["soon","🔥 Closing soon"],["fore","✨ Foreign founders"],["visa","🛂 Visa"],["money","💰 Money"],["space","🏢 Space"],["fun","🎉 Fun"],["global","🌏 Go global"]];
const D=[
 {tone:"pink",cat:"Visa",en:"Get a startup visa (D-8-4 / D-10-2) while you build",ko:"OASIS 4&5 창업이민종합지원",reg:"SEOUL",close:"2026-06-15",lens:["visa","fore"],badge:["fore","✨ For foreign founders"]},
 {tone:"green",cat:"Space",en:"Korea University's global startup track",ko:"고려대 KU GLOBAL STARTLINK",reg:"SEOUL",close:"2026-06-01",lens:["space","fore"],badge:["fore","✨ For foreign founders"]},
 {tone:"coral",cat:"Event",en:"Hanyang's startup pitch competition",ko:"한양대 캠퍼스타운 창업경진대회",reg:"SEOUL",close:"2026-06-01",lens:["fun","fore"],badge:["fore","✨ For foreign founders"]},
 {tone:"gold",cat:"Money",en:"Voucher to cover your patent filing costs",ko:"특허출원·등록 비용 바우처 지원",reg:"NATIONWIDE",close:"2026-05-23",lens:["money"]},
 {tone:"coral",cat:"Event",en:"Pitch to investors at Gangwon's demo day",ko:"강원 BRIDGE X 창업BuS 데모데이",reg:"NATIONWIDE",close:"2026-05-25",lens:["fun"]},
 {tone:"purple",cat:"Education",en:"Free course: build a smart-healthcare startup",ko:"PBL 스마트헬스케어 스타트업 육성과정",reg:"BUSAN",close:"2026-05-25",lens:["fun"],badge:["easy","⏳ 1 seat left"]},
 {tone:"purple",cat:"Education",en:"Startup 101: business model + writing your plan",ko:"도전창업트랙 2기 창업실무 기초교육",reg:"SEOUL",close:"2026-05-25",lens:["fun"],badge:["easy","🟢 Easy apply"]},
 {tone:"green",cat:"Space",en:"Free office space at a youth startup center",ko:"서대문청년창업센터 입주기업 모집",reg:"SEOUL",close:"2026-05-25",lens:["space"]},
 {tone:"teal",cat:"People",en:"Free on-site consulting to unstick your business",ko:"찾아가는 기업 고민해결 찐(眞)톡",reg:"SEOUL",close:"2026-05-27",lens:["fun"],badge:["easy","🟢 Easy apply"]},
 {tone:"blue",cat:"Global",en:"Show your startup at CES 2027, with Seoul",ko:"CES 2027 관악S밸리관 참가기업",reg:"NATIONWIDE",close:"2026-05-26",lens:["global"],badge:["glob","🌏 Abroad"]},
 {tone:"blue",cat:"Global",en:"Take your K-beauty brand overseas",ko:"B the B 글로벌 거점 확산 파트너사",reg:"NATIONWIDE",close:"2026-05-28",lens:["global"],badge:["glob","🌏 Abroad"]},
 {tone:"orange",cat:"R&D",en:"Makerspace + academy to productize a prototype",ko:"제조전문형 메이커스페이스 아카데미",reg:"GYEONGNAM",close:"2026-06-02",lens:["space"]},
 {tone:"blue",cat:"Global",en:"Break into Japan: open-innovation program",ko:"경기 스타트업 글로벌 (일본)",reg:"GYEONGGI",close:"2026-06-05",lens:["global"],badge:["glob","🌏 Abroad"]},
 {tone:"gold",cat:"Money",en:"Free e-commerce tools to grow your sales",ko:"2차 판로확대 지원사업 소상공인",reg:"NATIONWIDE",close:"2026-06-05",lens:["money"],badge:["easy","🟢 Easy apply"]},
 {tone:"blue",cat:"Global",en:"K-Startup's NYC program — land real US revenue",ko:"뉴욕 Revenue-First 성장 프로그램",reg:"NATIONWIDE",close:"2026-06-04",lens:["global"],badge:["glob","🌏 Abroad"]},
 {tone:"gold",cat:"Funding",en:"Road to TIPS: get matched with a VC",ko:"PRODIGY Road to TIPS 참가 기업",reg:"NATIONWIDE",close:"2026-06-10",lens:["money"]},
];
D.forEach(p=>{if(dd(p.close)<=7)p.lens=[...p.lens,"soon"];});
const STREAM=[["[창업] 청년창업가 기획자 양성","2026-05-27"],["강원 BRIDGE X 창업BuS 데모데이","2026-05-25"],["민간주도형 기술창업 활성화 지원","2026-05-31"],["유한킴벌리 시니어 임팩트 펠로우십","2026-06-05"],["대전 팁스아카데미 IR 작성","2026-05-27"],["SYNERGY CORE 4기 (투자)","2026-06-14"],["교보생명 오픈이노베이션 밋업","2026-05-26"],["U-SPACE 제품개발 통합지원","2026-06-04"],["강동구 청년해냄센터 입주","2026-06-05"],["노원사회적경제 입주기업 공모","2026-06-05"],["광명시 스타트업 챌린지","2026-07-01"],["Forbes Korea 30 Under 30 Summit","2026-06-08"],["포스텍홀딩스 TIPS 갈 팀","2026-06-21"],["울산 바이오 헬스케어 글로벌","2026-06-19"],["KOICA 포용적 비즈니스","2026-06-18"],["바이오 스타트업 액셀러레이팅","2026-06-11"],["2026 서울 유니콘 챌린지","2026-06-30"],["보건산업 혁신창업멤버스","2026-06-01"],["민관협력 오픈이노베이션 2차","2026-06-09"],["국립공주대 창업보육센터 입주","2026-06-10"],["APAN62 기업 쇼케이스","2026-05-29"],["전남형 AI·AX 스타트업","2026-06-08"],["부산 소상공인 IP창출 패키지","2026-06-15"],["코레일유통 청년창업 제휴","2026-05-29"],["숭실대 스타트업 아카데미","2026-06-19"],["동국대 창업보육센터 입주","2026-06-08"],["대전창업포럼 제102회","2026-05-29"],["스타트업 언론 홍보 지원","2026-05-31"],["경기 스타트업 아카데미 AWS","2026-05-29"],["칠곡군 중장년 기술창업","2026-06-15"],["화성 글로벌 스타트업 이륙작전","2026-05-27"],["AI 솔로프러너 프리오픈","2026-05-25"]];

let active="all";
const grid=document.getElementById('grid');
function card(p){
  const n=dd(p.close),hot=n<=3,[tint,ac]=TONE[p.tone];
  const badge=p.badge?`<span class="badge b-${p.badge[0]}">${p.badge[1]}</span>`:'';
  return `<a class="card" style="--tint:${tint};--ac:${ac}" href="https://www.k-startup.go.kr" target="_blank" rel="noopener">
    <div class="chead"><span class="cat">${p.cat}</span><span class="dday ${hot?'hot':''}">D-${n}</span></div>
    <h3>${p.en}</h3><span class="ko kr">${p.ko}</span>
    <div class="cfoot">${badge}<span class="reg">${p.reg}</span></div></a>`;
}
function render(){
  const rows=D.filter(p=>active==="all"||p.lens.includes(active)).sort((a,b)=>dd(a.close)-dd(b.close));
  grid.innerHTML=rows.map(card).join('')||'<p style="color:var(--muted);padding:40px">nothing in this lens</p>';
}
document.getElementById('pills').innerHTML=LENSES.map(([k,l])=>{const c=k==="all"?D.length:D.filter(p=>p.lens.includes(k)).length;return `<button class="pill${k==='all'?' on':''}" data-k="${k}">${l}<span class="n">${c}</span></button>`;}).join('');
document.getElementById('pills').addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;active=b.dataset.k;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x===b));render();});
document.getElementById('tl').innerHTML=STREAM.map(([t,d])=>{const n=dd(d),hot=n<=3;return `<a class="tl" href="https://www.k-startup.go.kr" target="_blank" rel="noopener"><span class="tl-d ${hot?'hot':''}">D-${n}</span><span class="tl-t kr">${t}</span></a>`;}).join('');
render();
</script>
</body>
</html>
