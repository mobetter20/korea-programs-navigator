        --grey:#7a7a7a;--grey-dark:#4a4a4a;--grey-light:#b5b5b5;--grey-lighter:#dbdbdb;--ink:#1a1a1a;--black:#0a0a0a;
        --doom-tint:#ffe9f7;--shine-tint:#fff8d9;--auto:#2da854;--rail-w:60px;--col:284px}
  *{box-sizing:border-box;margin:0;padding:0}

  .lens .ct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--grey)}

  #feed{flex:20 1 auto;min-width:0;background:#fff;padding:0 24px}

  .ind-meta{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:8px;color:var(--grey-light);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase}

  .ind-num{font-family:'Bagel Fat One',cursive;font-size:44px;line-height:.95;color:var(--secondary-dark)}.ind.hot .ind-num{color:var(--primary-dark)}
  .ind-unit{padding-bottom:6px;color:var(--grey);font-family:'JetBrains Mono',monospace;font-size:12px}
  .ind-ctx{margin-left:auto;padding-bottom:5px;font-size:12px;font-weight:700}
  .ctx-fore{color:var(--primary-dark)}.ctx-easy{color:var(--secondary-dark)}.ctx-glob{color:#2f6bd8}
  .blurb{color:var(--grey-dark);font-size:14px;margin-bottom:9px;max-width:62ch}
  .ind-foot{display:flex;justify-content:space-between;gap:12px;color:var(--grey);font-family:'JetBrains Mono',monospace;font-size:11px}
  .ind-src{color:var(--grey-dark);border-bottom:1px dotted currentColor}

  #stream{flex:1 0 var(--col);min-width:var(--col);background:#fff;border-left:1px dotted var(--grey-lighter);padding:0 14px}
  #stream header{position:sticky;top:0;z-index:100;padding:20px 4px 12px;background-image:linear-gradient(0deg,transparent,#fff 50%)}
  #stream header h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-dark)}
  .tl{display:flex;align-items:center;gap:9px;min-height:30px;padding:5px 4px;border-radius:3px;font-size:11.5px;color:inherit}

  .tl-c{flex:none;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--grey-light)}
  .tl-more{text-align:center;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--primary-dark);background:linear-gradient(to bottom,#fff,var(--doom-tint))}

        <div class="ind-row"><span class="ind-num">D-${n}</span><span class="ind-unit">days left</span>${ctx}</div>
        <div class="blurb">${p.blurb}</div>
        <div class="ind-foot"><span class="ind-src">See the 공고 →</span><span>${p.ag}</span></div>
      </div></a>`;
  }).join('')||'<p style="padding:40px 0;color:var(--grey);text-align:center">nothing in this lens — try another</p>';
}
document.getElementById('lenses').innerHTML=LENSES.map(([k,ic,nm])=>{
  const ct=k==="all"?D.length:D.filter(p=>p.lens.includes(k)).length;
  return `<button class="lens${k==='all'?' on':''}" data-k="${k}"><span class="ico">${ic}</span><span class="nm">${nm}</span><span class="ct">${ct}</span></button>`;
}).join('');
document.getElementById('lenses').addEventListener('click',e=>{const b=e.target.closest('.lens');if(!b)return;active=b.dataset.k;document.querySelectorAll('.lens').forEach(x=>x.classList.toggle('on',x===b));render();});
document.getElementById('tl').innerHTML=STREAM.map(s=>{const n=dd(s.d),hot=n<=3;return `<a class="tl" href="https://www.k-startup.go.kr" target="_blank" rel="noopener"><span class="tl-d ${hot?'hot':''}">D-${n}</span><span class="tl-t kr">${s.t}</span><span class="tl-c">${s.c}</span></a>`;}).join('');
render();
</script>
</body>
</html>
