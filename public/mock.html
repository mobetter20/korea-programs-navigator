<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korea Programs Navigator — live feed</title>
<style>
  @font-face{font-family:'Bagel Fat One';src:url('fonts/bagel-fat-one/bagel-fat-one-400-091.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Source Sans 3';src:url('fonts/source-sans-3/source-sans-3-400-006.woff2') format('woff2');font-weight:400;font-display:swap}
  :root{--pink:#ff52e5;--pink-dk:#ca27b2;--butter:#f6d242;--butter-tint:#fff8d9;--pink-tint:#ffe9f7;
        --ink:#1a1a1a;--muted:#857e92;--bg:#fbf7f0;--card:#fff;--line:#efe7da}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .fat{font-family:'Bagel Fat One','Arial Black',sans-serif;font-weight:400}

  header{position:sticky;top:0;z-index:10;background:rgba(251,247,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:1040px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px}
  .brand{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .brand .dot{color:var(--pink)}
  .live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .live .led{width:8px;height:8px;border-radius:50%;background:#2da854;animation:p 1.8s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(45,168,84,.55)}70%{box-shadow:0 0 0 7px rgba(45,168,84,0)}100%{box-shadow:0 0 0 0 rgba(45,168,84,0)}}
  .lenses{max-width:1040px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .lenses::-webkit-scrollbar{display:none}
  .lens{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap;transition:.12s}
  .lens:hover{border-color:var(--pink)}
  .lens.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .feed{max-width:1040px;margin:0 auto;padding:20px 16px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(284px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:.14s;text-decoration:none;color:inherit}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px -16px rgba(40,20,60,.4);border-color:#e6dccb}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .dday{font-size:33px;line-height:.85;color:var(--ink)}
  .dday small{display:block;font-family:'Source Sans 3';font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);margin-top:3px}
  .dday.hot{color:var(--pink)}
  .pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;white-space:nowrap}
  .pill.fore{background:var(--pink);color:#fff}
  .pill.glob{background:#e8f0ff;color:#2f6bd8}
  .pill.easy{background:var(--butter-tint);color:#8a6d00;border:1px solid #ecd98a}
  h3{font-size:15.5px;line-height:1.32;font-weight:700}
  .ko{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blurb{font-size:13.5px;color:#5f5870;line-height:1.45}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:1px}
  .tag{font-size:11px;padding:3px 8px;border-radius:7px;background:#f4eee5;color:#6a6478}
  .tag.cat{background:var(--butter);color:#5a4a00;font-weight:700}
  .seat{background:var(--pink-tint);color:var(--pink-dk);font-weight:700}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Korea Programs Navigator<span class="dot">.</span></span>
    <span class="live"><span class="led"></span> <span class="fat" style="font-size:13px">296</span> LIVE · UPDATED JUST NOW</span>
  </div>
  <div class="lenses" id="lenses"></div>
</header>
<main class="feed" id="feed"></main>

<script>
const TODAY=new Date('2026-05-23');
const dd=iso=>Math.max(0,Math.ceil((new Date(iso)-TODAY)/864e5));
const LENSES=[["all","All"],["soon","🔥 Closing soon"],["fore","✨ For foreigners"],["fun","🎉 Fun"],["money","💰 Money"],["space","🏢 Space"],["global","🌏 Go global"]];
const D=[
 {en:"Get a startup visa (D-8-4 / D-10-2) while you build",ko:"2026 창업이민종합지원시스템(OASIS 4&5)",blurb:"OASIS — Korea's startup-immigration track, built for foreign founders. Any stage, no age limit.",cat:"Mentoring",reg:"Seoul",close:"2026-06-15",lens:["fore"],pill:["fore","✨ Foreign founders"]},
 {en:"Korea University's global startup track",ko:"[고려대 캠퍼스타운] KU GLOBAL STARTLINK",blurb:"Find a team, get space + mentoring at KU's campus town. For global founders.",cat:"Space",reg:"Seoul",close:"2026-06-01",lens:["fore","space"],pill:["fore","✨ Foreign founders"]},
 {en:"Hanyang's startup pitch competition",ko:"2026 한양대 캠퍼스타운 창업경진대회",blurb:"Bring a bold idea, pitch it, win backing. Open to foreign founders.",cat:"Event",reg:"Seoul",close:"2026-06-01",lens:["fore","fun"],pill:["fore","✨ Foreign founders"]},
 {en:"Voucher to cover your patent filing costs",ko:"2026 특허출원·등록 비용 바우처 지원",blurb:"Protect your tech — the program pays the filing + registration fees.",cat:"Money",reg:"Nationwide",close:"2026-05-23",lens:["money"]},
 {en:"Pitch to investors at Gangwon's demo day",ko:"2026 강원 BRIDGE X 창업BuS 데모데이",blurb:"Get in front of investors hunting for early startups.",cat:"Event",reg:"Nationwide",close:"2026-05-25",lens:["fun"]},
 {en:"Free course: build a smart-healthcare startup",ko:"PBL 스마트헬스케어 (예비)스타트업 육성과정",blurb:"Fully state-funded training — idea to healthcare startup.",cat:"Education",reg:"Busan",close:"2026-05-25",lens:["fun"],seat:"1 seat left"},
 {en:"Startup 101: business model + writing your plan",ko:"도전창업트랙 2기 [창업실무 기초교육]",blurb:"The fundamentals, for first-timers. The plan that unlocks the rest.",cat:"Education",reg:"Seoul",close:"2026-05-25",lens:["fun"],pill:["easy","🟢 Easy apply"]},
 {en:"Free office space at a youth startup center",ko:"서대문청년창업센터 입주기업 모집",blurb:"Move into a free, run office in Seodaemun, Seoul.",cat:"Space",reg:"Seoul",close:"2026-05-25",lens:["space"]},
 {en:"Free on-site consulting to unstick your business",ko:"찾아가는 기업 고민해결 찐(眞)톡",blurb:"A consultant comes to you and solves one specific problem.",cat:"People",reg:"Seoul",close:"2026-05-27",lens:["fun"],pill:["easy","🟢 Easy apply"]},
 {en:"Show your startup at CES 2027, with Seoul",ko:"CES 2027 관악S밸리관 참가기업 모집",blurb:"Join the Seoul delegation to the world's biggest tech show.",cat:"Global",reg:"Nationwide",close:"2026-05-26",lens:["global"],pill:["glob","🌏 Abroad"]},
 {en:"Take your K-beauty brand overseas",ko:"2026 B the B 글로벌 거점 확산 파트너사",blurb:"Get help opening overseas retail for your beauty brand.",cat:"Global",reg:"Nationwide",close:"2026-05-28",lens:["global"],pill:["glob","🌏 Abroad"]},
 {en:"Makerspace + academy to productize a prototype",ko:"제조전문형 메이커스페이스 메이킹 아카데미",blurb:"For hardware founders — tools and help to turn a prototype into a product.",cat:"R&D",reg:"Gyeongnam",close:"2026-06-02",lens:["space"]},
 {en:"Break into Japan: open-innovation program",ko:"경기 스타트업 글로벌 성장지원 (일본)",blurb:"Match with Japanese partners + chase local investment.",cat:"Global",reg:"Gyeonggi",close:"2026-06-05",lens:["global"],pill:["glob","🌏 Abroad"]},
 {en:"Free e-commerce tools to grow your sales",ko:"2026 2차 판로확대 지원사업 소상공인",blurb:"A shopping-mall management solution, on the house.",cat:"Money",reg:"Nationwide",close:"2026-06-05",lens:["money"],pill:["easy","🟢 Easy apply"]},
 {en:"K-Startup's NYC program — land real US revenue",ko:"2026 뉴욕 Revenue-First 성장 프로그램",blurb:"Get into the New York market and chase actual sales, not just demos.",cat:"Global",reg:"Nationwide",close:"2026-06-04",lens:["global"],pill:["glob","🌏 Abroad"]},
 {en:"Road to TIPS: get matched with a VC",ko:"PRODIGY Road to TIPS 참가 기업 모집",blurb:"The on-ramp to TIPS — Korea's flagship gov't scale-up funding.",cat:"Funding",reg:"Nationwide",close:"2026-06-10",lens:["money"]},
];
D.forEach(p=>{ if(dd(p.close)<=7) p.lens=[...p.lens,"soon"]; });

let active="all";
const feed=document.getElementById('feed');
function card(p){
  const d=dd(p.close), hot=d<=3;
  const pill=p.pill?`<span class="pill ${p.pill[0]}">${p.pill[1]}</span>`:'';
  const seat=p.seat?`<span class="tag seat">⏳ ${p.seat}</span>`:'';
  return `<a class="card" href="https://www.k-startup.go.kr" target="_blank" rel="noopener">
    <div class="top"><div class="dday fat ${hot?'hot':''}">D-${d}<small>${p.close.slice(5).replace('-','/')}</small></div>${pill}</div>
    <h3>${p.en}<span class="ko">${p.ko}</span></h3>
    <div class="blurb">${p.blurb}</div>
    <div class="tags"><span class="tag cat">${p.cat}</span><span class="tag">📍 ${p.reg}</span>${seat}</div>
  </a>`;
}
function render(){
  const rows=D.filter(p=>active==="all"||p.lens.includes(active)).sort((a,b)=>dd(a.close)-dd(b.close));
  feed.innerHTML = rows.length?rows.map(card).join(''):'<div class="empty">nothing here yet — try another lens</div>';
}
document.getElementById('lenses').innerHTML=LENSES.map(([k,l])=>`<button class="lens${k==='all'?' on':''}" data-k="${k}">${l}</button>`).join('');
document.getElementById('lenses').addEventListener('click',e=>{
  const b=e.target.closest('.lens'); if(!b)return;
  active=b.dataset.k;
  document.querySelectorAll('.lens').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
render();
</script>
</body>
</html>
