<style>

  .lens:hover{border-color:var(--pink)}.lens.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .layout{max-width:1180px;margin:0 auto;display:flex;gap:20px;padding:18px 18px 70px}
  .feed{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:14px;align-content:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:.14s;text-decoration:none;color:inherit}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px -16px rgba(40,20,60,.4);border-color:#e6dccb}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .dday{font-size:32px;line-height:.85;color:var(--ink)}.dday small{display:block;font-family:'Source Sans 3';font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);margin-top:3px}.dday.hot{color:var(--pink)}
  .pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;white-space:nowrap}
  .pill.fore{background:var(--pink);color:#fff}.pill.glob{background:#e8f0ff;color:#2f6bd8}.pill.easy{background:var(--butter-tint);color:#8a6d00;border:1px solid #ecd98a}
  h3{font-size:15.5px;line-height:1.32;font-weight:700}
  .ko{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blurb{font-size:13.5px;color:#5f5870;line-height:1.45}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:1px}
  .tag{font-size:11px;padding:3px 8px;border-radius:7px;background:#f4eee5;color:#6a6478}.tag.cat{background:var(--butter);color:#5a4a00;font-weight:700}.seat{background:var(--pink-tint);color:var(--pink-dk);font-weight:700}

  .stream{width:296px;flex:none;align-self:flex-start;position:sticky;top:112px;max-height:calc(100vh - 130px);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .shead{padding:13px 15px 11px;border-bottom:1px solid var(--line)}
  .shead b{font-size:13px}.shead .sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
  .srows{overflow:auto;padding:2px 6px 0}
  .srow{display:flex;gap:9px;align-items:baseline;padding:8px 8px;border-bottom:1px solid #f5efe6;text-decoration:none;color:inherit}
  .srow:hover{background:#faf5ec}
  .sd{font-family:'Bagel Fat One','Arial Black';font-size:13px;min-width:34px;color:var(--muted)}.sd.hot{color:var(--pink)}
  .st{flex:1;font-size:12px;line-height:1.3;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc{font-size:10px;color:#a59db4;flex:none}
  .more{text-align:center;padding:12px;font-size:12px;font-weight:700;color:var(--pink);background:linear-gradient(to bottom,#fff,var(--pink-tint))}
  @media(max-width:900px){.stream{display:none}}
</style>
