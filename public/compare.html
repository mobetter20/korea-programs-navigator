<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPN — mock compare</title>
<style>
  body{margin:0;font-family:-apple-system,"Segoe UI",sans-serif;background:#1c1a20}
  .tb{display:flex;gap:8px;align-items:center;padding:9px 16px;background:#141318;color:#fff;border-bottom:1px solid #2c2a32}
  .tb b{font-size:13px;margin-right:6px}
  button{font-family:inherit;font-size:13px;font-weight:700;border:1px solid #3a3842;background:#26242c;color:#b9b4c2;padding:7px 15px;border-radius:9px;cursor:pointer}
  button.on{background:#ff52e5;color:#fff;border-color:#ff52e5}
  .lab{color:#857f90;font-size:12px;margin-left:auto;font-family:ui-monospace,Menlo,monospace}
  iframe{width:100%;height:calc(100vh - 45px);border:0;display:block;background:#fff}
</style></head><body>
<div class="tb"><b>KPN mockups —</b>
  <button class="on" data-s="v5.html" data-l="v5 · category rainbow + duplicate sidebar">v5</button>
  <button data-s="v6.html" data-l="v6 · restrained poppy-pink · Browse/Just-in modes · no sidebar">v6</button>
  <span class="lab" id="lab">v5 · category rainbow + duplicate sidebar</span>
</div>
<iframe id="f" src="v5.html"></iframe>
<script>
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('f').src=b.dataset.s; document.getElementById('lab').textContent=b.dataset.l;
});
</script></body></html>
