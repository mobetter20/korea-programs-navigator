<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eef0f4"/>
      <stop offset="100%" stop-color="#e8e2f2"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff52e5"/>
      <stop offset="100%" stop-color="#ca27b2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative pink arc — top-right corner, subtle -->
  <circle cx="1140" cy="-60" r="320" fill="none" stroke="#ff52e5" stroke-width="2" opacity="0.18"/>
  <circle cx="1140" cy="-60" r="220" fill="none" stroke="#ca27b2" stroke-width="1.5" opacity="0.12"/>

  <!-- Bottom-left dot cluster -->
  <circle cx="80" cy="580" r="6" fill="#ff52e5" opacity="0.25"/>
  <circle cx="104" cy="580" r="4" fill="#ca27b2" opacity="0.18"/>
  <circle cx="80" cy="556" r="4" fill="#ff52e5" opacity="0.15"/>

  <!-- Pink accent bar — left edge -->
  <rect x="72" y="180" width="6" height="120" rx="3" fill="url(#accent-bar)"/>

  <!-- "Start" wordmark — display font fallback stack -->
  <text x="96" y="272"
        font-family="'Bagel Fat One','Arial Black','Impact',sans-serif"
        font-size="100"
        font-weight="900"
        fill="#ff52e5"
        letter-spacing="-2">Start</text>

  <!-- "Seoul Crushing" — secondary wordmark -->
  <text x="96" y="338"
        font-family="'Source Sans 3','Helvetica Neue','Arial',sans-serif"
        font-size="44"
        font-weight="700"
        fill="#1a1a1a"
        letter-spacing="-0.5">Seoul Crushing</text>

  <!-- Divider -->
  <rect x="96" y="364" width="520" height="2" rx="1" fill="#e9e1d4"/>

  <!-- Tagline -->
  <text x="96" y="408"
        font-family="'Source Sans 3','Helvetica Neue','Arial',sans-serif"
        font-size="26"
        font-weight="400"
        fill="#8c8598">Korean startup &amp; business support</text>
  <text x="96" y="444"
        font-family="'Source Sans 3','Helvetica Neue','Arial',sans-serif"
        font-size="26"
        font-weight="400"
        fill="#8c8598">— in English, for foreign founders</text>

  <!-- Card visual — right side -->
  <rect x="740" y="140" width="360" height="200" rx="18" fill="#fff" opacity="0.9"/>
  <rect x="740" y="140" width="360" height="200" rx="18" fill="none" stroke="#e9e1d4" stroke-width="1.5"/>
  <!-- Card category pill -->
  <rect x="764" y="164" width="68" height="22" rx="6" fill="#ede8f8"/>
  <text x="798" y="180" font-family="'Courier New',monospace" font-size="10" font-weight="800" fill="#7c4dd6" text-anchor="middle" letter-spacing="0.5">GRANTS</text>
  <!-- Card badge -->
  <rect x="844" y="164" width="130" height="22" rx="11" fill="#ff52e5"/>
  <text x="909" y="180" font-family="'Helvetica Neue','Arial',sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">For foreign founders</text>
  <!-- Card title lines -->
  <rect x="764" y="200" width="220" height="14" rx="4" fill="#1a1a1a" opacity="0.85"/>
  <rect x="764" y="222" width="280" height="11" rx="3" fill="#8c8598" opacity="0.5"/>
  <rect x="764" y="241" width="240" height="11" rx="3" fill="#8c8598" opacity="0.35"/>
  <!-- Card facts grid -->
  <rect x="764" y="268" width="130" height="46" rx="8" fill="#f6f4fb"/>
  <rect x="902" y="268" width="130" height="46" rx="8" fill="#f6f4fb"/>
  <text x="829" y="285" font-family="'Courier New',monospace" font-size="8" font-weight="800" fill="#8c8598" text-anchor="middle" letter-spacing="0.5">REGION</text>
  <text x="829" y="302" font-family="'Helvetica Neue','Arial',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Nationwide</text>
  <text x="967" y="285" font-family="'Courier New',monospace" font-size="8" font-weight="800" fill="#8c8598" text-anchor="middle" letter-spacing="0.5">CLOSES</text>
  <text x="967" y="302" font-family="'Helvetica Neue','Arial',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Jun 30, 2026</text>

  <!-- Second card, offset -->
  <rect x="760" y="358" width="360" height="160" rx="18" fill="#fff" opacity="0.7"/>
  <rect x="760" y="358" width="360" height="160" rx="18" fill="none" stroke="#e9e1d4" stroke-width="1.5"/>
  <rect x="784" y="382" width="56" height="22" rx="6" fill="#ede8f8"/>
  <text x="812" y="398" font-family="'Courier New',monospace" font-size="10" font-weight="800" fill="#7c4dd6" text-anchor="middle" letter-spacing="0.5">BUILD</text>
  <rect x="784" y="418" width="240" height="13" rx="4" fill="#1a1a1a" opacity="0.8"/>
  <rect x="784" y="438" width="290" height="10" rx="3" fill="#8c8598" opacity="0.45"/>
  <rect x="784" y="455" width="200" height="10" rx="3" fill="#8c8598" opacity="0.3"/>
  <rect x="784" y="480" width="100" height="32" rx="10" fill="#ff52e5"/>
  <text x="834" y="501" font-family="'Helvetica Neue','Arial',sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Apply →</text>

  <!-- URL / domain stamp -->
  <text x="96" y="560"
        font-family="'Courier New',monospace"
        font-size="20"
        font-weight="700"
        fill="#ca27b2"
        opacity="0.7">start.seoulcrushing.com</text>
</svg>
